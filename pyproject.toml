[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-mirror"
version = "0.1.0"
description = "Local-first wellbeing copilot: posture and sedentary nudges from your webcam, processed entirely on your machine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "desktop-notifier>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motion-mirror = "motion_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motion_mirror = ["default_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
